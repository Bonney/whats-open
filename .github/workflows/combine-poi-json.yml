name: Combine JSON files
on:
  push:
    branches:
      - main

jobs:
  combine-json:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Combine POI JSON files
      run: |
        # Create an empty array to store the combined JSON objects
        combined_json=()
        
        # Loop through all JSON files in the specified directory
        for file in docs/restaurants/*.json; do
          # Read the content of each file and append it to the combined JSON array
          combined_json+=("$(cat "$file")")
        done
        
        # Join the JSON objects with a comma
        combined_json=$(printf ",%s" "${combined_json[@]}")
        
        # Remove the leading comma and wrap the result in square brackets to create a valid JSON array
        combined_json="[$(echo "$combined_json" | cut -c 2-)]"
        
        # Save the combined JSON to a file
        echo "$combined_json" > docs/restaurants.json
        
        # Print the combined JSON
        echo "Combined JSON: $combined_json"
        
    - name: Commit and push changes
      run: |
        git config user.name "bonney"
        git config user.email "bonneym@gmail.com"
        git add docs/restaurants.json
        git commit -m "Combine POI JSON files"
        git push
