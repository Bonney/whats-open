<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Edit Restaurants</title>
  <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
  <h1>Edit Restaurants</h1>

  <form id="edit-form">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="address">Address:</label>
    <input type="text" id="address" name="address" required>

    <label for="phone">Phone:</label>
    <input type="tel" id="phone" name="phone" required>

    <label for="hours">Hours:</label>
    <div id="hours">
      <label>Monday:</label>
      <input type="text" name="monday" required>
      <br>
      <label>Tuesday:</label>
      <input type="text" name="tuesday" required>
      <br>
      <label>Wednesday:</label>
      <input type="text" name="wednesday" required>
      <br>
      <label>Thursday:</label>
      <input type="text" name="thursday" required>
      <br>
      <label>Friday:</label>
      <input type="text" name="friday" required>
      <br>
      <label>Saturday:</label>
      <input type="text" name="saturday" required>
      <br>
      <label>Sunday:</label>
      <input type="text" name="sunday" required>
    </div>

    <button type="submit">Add Restaurant</button>
  </form>

  <a href="index.html">View Restaurants</a>

  <script src="script.js"></script>
</body>
</html>
